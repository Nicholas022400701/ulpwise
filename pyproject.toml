[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ulpwise"
version = "0.3.0"
description = "Numerical conformance testing for ML code: float edge values, exact rounding oracles, knife-edge finders and a pytest plugin"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "区梓灏 (Nicholas022400701)" }]
keywords = ["floating-point", "ulp", "numerics", "testing", "pytest", "pytorch", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "numpy"]
survey = ["numpy", "mpmath>=1.3"]

[project.scripts]
ulpwise = "ulpwise.__main__:main"

[project.entry-points.pytest11]
ulpwise = "ulpwise.plugin"

[project.urls]
Repository = "https://github.com/Nicholas022400701/ulpwise"
Issues = "https://github.com/Nicholas022400701/ulpwise/issues"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "ulpwise._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
