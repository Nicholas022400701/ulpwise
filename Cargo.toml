[package]
name = "ulpwise"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Numerical conformance testing for ML code: float edge values, exact rounding oracles and knife-edge finders"
repository = "https://github.com/Nicholas022400701/ulpwise"
keywords = ["floating-point", "ulp", "testing", "numerics", "pytest"]
categories = ["development-tools::testing", "mathematics"]

[lib]
name = "ulpwise"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
lto = true
codegen-units = 1
