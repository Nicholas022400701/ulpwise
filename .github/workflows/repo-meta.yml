name: repo-meta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository topics and homepage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit "$GITHUB_REPOSITORY" \
            --homepage "https://pypi.org/project/ulpwise/" \
            --add-topic floating-point --add-topic ieee754 --add-topic ulp --add-topic numerical-testing \
            --add-topic pytest-plugin --add-topic pytorch --add-topic numpy --add-topic rust --add-topic testing-tools --add-topic correctness
