name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-features -- -D warnings
      - run: cargo test --release

  python:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest numpy packaging
      - run: pip install .
      - run: pytest tests/test_core.py -q -p no:cacheprovider
      - name: sqrt conformance of numpy on this platform
        run: python examples/torch_sqrt_conformance.py && python examples/sqrt_knife_values.py

  corpus:
    name: regression corpus (ubuntu, torch cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy packaging scipy
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install kornia timm peft torchrl
      - run: pip install .
      - run: pytest tests -q -p no:cacheprovider -rxXs
      - name: sqrt conformance of torch and numpy on this platform
        run: python examples/torch_sqrt_conformance.py && python examples/sqrt_knife_values.py
